<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDICAL DIG 帰国生・IB入試データベース v1.13.2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1a3a5c;
  --navy-dark: #0f2540;
  --navy-mid: #2a5080;
  --gold: #e8a020;
  --gold-light: #f5c043;
  --gold-pale: #fdf3dc;
  --white: #ffffff;
  --gray-50: #f8f9fa;
  --gray-100: #f0f2f5;
  --gray-200: #e2e6ea;
  --gray-400: #9aa3ad;
  --gray-600: #5a6472;
  --gray-800: #2c3440;
  --tag-bg: #e8f0f8;
  --tag-color: #1a3a5c;
  --border: #d0dae6;
  --shadow: 0 2px 12px rgba(26,58,92,0.10);
  --shadow-md: 0 4px 24px rgba(26,58,92,0.14);
  --radius: 8px;
  --radius-lg: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--gray-100);
  color: var(--gray-800);
  min-height: 100vh;
}

/* ─── HEADER ─── */
header {
  background: var(--navy-dark);
  border-bottom: 3px solid var(--gold);
  padding: 0 32px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(0,0,0,0.25);
}
.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}
.logo {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.logo-main {
  font-family: 'Noto Serif JP', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 0.04em;
}
.logo-main span { color: var(--gold); }
.logo-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.55);
  letter-spacing: 0.06em;
  font-weight: 300;
}
.header-meta {
  font-size: 11px;
  color: rgba(255,255,255,0.45);
}

/* ─── LAYOUT ─── */
.app-layout {
  max-width: 1400px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 24px;
  padding: 24px 24px 48px;
  align-items: start;
}

/* ─── SIDEBAR ─── */
.sidebar {
  position: sticky;
  top: 88px;
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 108px);
}
.sidebar-header {
  background: var(--navy);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.sidebar-header h2 {
  font-size: 13px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 0.06em;
}
.sidebar-header svg { color: var(--gold); flex-shrink: 0; }

.sidebar-body {
  padding: 16px;
  overflow-y: auto;
  flex: 1;
  /* スクロールバーをスリムに */
  scrollbar-width: thin;
  scrollbar-color: var(--gray-200) transparent;
}
.sidebar-body::-webkit-scrollbar { width: 4px; }
.sidebar-body::-webkit-scrollbar-track { background: transparent; }
.sidebar-body::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 2px; }
.sidebar-body::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }

.filter-section { margin-bottom: 18px; }
.filter-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.10em;
  color: var(--gray-400);
  text-transform: uppercase;
  margin-bottom: 8px;
  display: block;
}

/* Search */
.search-wrap {
  position: relative;
  margin-bottom: 20px;
}
.search-wrap svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gray-400);
  pointer-events: none;
}
.search-input {
  width: 100%;
  padding: 9px 10px 9px 34px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: inherit;
  color: var(--gray-800);
  background: var(--gray-50);
  transition: border-color 0.2s;
}
.search-input:focus { outline: none; border-color: var(--navy-mid); background: var(--white); }

/* Region tabs */
.region-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  margin-bottom: 10px;
}
.region-btn {
  padding: 6px 4px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  background: var(--white);
  font-size: 11px;
  font-family: inherit;
  color: var(--gray-600);
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
  font-weight: 500;
}
.region-btn:hover { border-color: var(--navy-mid); color: var(--navy); }
.region-btn.active {
  background: var(--navy);
  border-color: var(--navy);
  color: var(--white);
}

/* Checkbox filters */
.check-group { display: flex; flex-direction: column; gap: 6px; }
.check-item {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  font-size: 12px;
  color: var(--gray-600);
  transition: color 0.15s;
}
.check-item:hover { color: var(--navy); }
.check-item input[type="checkbox"] {
  width: 14px; height: 14px;
  accent-color: var(--navy);
  cursor: pointer;
}
.check-item input:checked + span { color: var(--navy); font-weight: 500; }

/* Tags filter */
.tags-filter { display: flex; flex-wrap: wrap; gap: 5px; }
.tag-btn {
  padding: 4px 9px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--white);
  font-size: 11px;
  font-family: inherit;
  color: var(--gray-600);
  cursor: pointer;
  transition: all 0.15s;
  font-weight: 500;
}
.tag-btn:hover { border-color: var(--navy-mid); color: var(--navy); }
.tag-btn.active {
  background: var(--navy);
  border-color: var(--navy);
  color: var(--white);
}

/* Reset button */
.reset-btn {
  width: 100%;
  padding: 9px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--white);
  font-family: inherit;
  font-size: 12px;
  color: var(--gray-600);
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 4px;
}
.reset-btn:hover { border-color: var(--navy); color: var(--navy); background: var(--gray-50); }

.divider { height: 1px; background: var(--gray-200); margin: 14px 0; }

/* ─── MAIN CONTENT ─── */
.main-content { min-width: 0; }

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 12px;
  flex-wrap: wrap;
}
.result-count {
  font-size: 13px;
  color: var(--gray-600);
}
.result-count strong { color: var(--navy); font-weight: 700; font-size: 15px; }
.toolbar-actions { display: flex; gap: 8px; }

.btn-compare, .btn-pdf {
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 12px;
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
  letter-spacing: 0.04em;
}
.btn-compare {
  background: var(--white);
  border: 1.5px solid var(--navy);
  color: var(--navy);
}
.btn-compare:hover { background: var(--navy); color: var(--white); }
.btn-pdf {
  background: var(--gold);
  border: 1.5px solid var(--gold);
  color: var(--navy-dark);
}
.btn-pdf:hover { background: var(--gold-light); }

/* Compare bar */
.compare-bar {
  background: var(--navy);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 16px;
  display: none;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.compare-bar.show { display: flex; }
.compare-bar-label { font-size: 12px; color: rgba(255,255,255,0.7); font-weight: 500; }
.compare-pills { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.compare-pill {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  color: var(--white);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.compare-pill button {
  background: none; border: none; color: rgba(255,255,255,0.7);
  cursor: pointer; font-size: 13px; line-height: 1; padding: 0;
}
.compare-pill button:hover { color: var(--white); }
.btn-run-compare {
  padding: 7px 14px;
  background: var(--gold);
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  color: var(--navy-dark);
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
.btn-run-compare:hover { background: var(--gold-light); }

/* University cards */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}

.uni-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: box-shadow 0.2s, transform 0.2s;
  cursor: pointer;
  border: 2px solid transparent;
  position: relative;
}
.uni-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.uni-card.selected { border-color: var(--gold); }
.card-selected-badge {
  position: absolute;
  top: 10px; right: 10px;
  background: var(--gold);
  color: var(--navy-dark);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  display: none;
}
.uni-card.selected .card-selected-badge { display: block; }

.card-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--gray-200);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.card-title-wrap { flex: 1; min-width: 0; }
.card-type-badges { display: flex; gap: 5px; margin-bottom: 6px; }
.badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 0.04em;
}
.badge-national { background: #ddeeff; color: #1a4a7a; }
.badge-public { background: #e0f0e0; color: #1a5a2a; }
.badge-private { background: #fff0dd; color: #7a4a10; }
.badge-kikoku { background: var(--navy); color: var(--white); }
.badge-ib { background: var(--gold); color: var(--navy-dark); }

.card-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--navy-dark);
  font-family: 'Noto Serif JP', serif;
  line-height: 1.4;
}
.card-region {
  font-size: 11px;
  color: var(--gray-400);
  margin-top: 3px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.card-body { padding: 12px 16px; }

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
}
.info-item {}
.info-item-label {
  font-size: 10px;
  color: var(--gray-400);
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.info-item-value {
  font-size: 12px;
  color: var(--gray-800);
  font-weight: 500;
  line-height: 1.4;
}
.info-item-value.highlight { color: var(--navy); font-weight: 700; }

.card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.card-tag {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 20px;
  background: var(--tag-bg);
  color: var(--tag-color);
  font-weight: 500;
}

.card-footer {
  padding: 10px 16px;
  border-top: 1px solid var(--gray-200);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.card-link {
  font-size: 11px;
  color: var(--navy-mid);
  text-decoration: none;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: 5px;
  border: 1px solid var(--border);
  transition: all 0.15s;
}
.card-link:hover { background: var(--navy); color: var(--white); border-color: var(--navy); }
.card-link.disabled { color: var(--gray-400); pointer-events: none; }

/* Empty state */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--gray-400);
}
.empty-state p { font-size: 14px; margin-top: 8px; }

/* ─── COMPARE MODAL ─── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,20,40,0.6);
  z-index: 200;
  padding: 24px;
  overflow-y: auto;
}
.modal-overlay.show { display: block; }
.modal {
  background: var(--white);
  border-radius: var(--radius-lg);
  max-width: 1100px;
  margin: 0 auto;
  box-shadow: 0 8px 48px rgba(0,0,0,0.25);
  overflow: hidden;
}
.modal-header {
  background: var(--navy-dark);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid var(--gold);
}
.modal-header h2 {
  font-size: 15px;
  font-weight: 700;
  color: var(--white);
  font-family: 'Noto Serif JP', serif;
}
.modal-close {
  background: none;
  border: none;
  color: rgba(255,255,255,0.7);
  font-size: 22px;
  cursor: pointer;
  line-height: 1;
  transition: color 0.15s;
}
.modal-close:hover { color: var(--white); }
.modal-body { padding: 24px; overflow-x: auto; }

.compare-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.compare-table th {
  background: var(--navy);
  color: var(--white);
  padding: 10px 14px;
  text-align: left;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.compare-table th:first-child { width: 130px; }
.compare-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--gray-200);
  vertical-align: top;
  line-height: 1.5;
}
.compare-table tr:nth-child(even) td { background: var(--gray-50); }
.compare-table td:first-child {
  font-weight: 700;
  color: var(--gray-600);
  font-size: 11px;
  letter-spacing: 0.04em;
  background: var(--gray-100);
  white-space: nowrap;
}
.compare-table .uni-header {
  background: var(--navy-dark);
  color: var(--white);
  font-family: 'Noto Serif JP', serif;
  font-size: 13px;
  text-align: center;
}
.compare-table .uni-header .sub {
  font-size: 10px;
  opacity: 0.6;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 400;
  display: block;
}

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--gray-200);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}
.btn-pdf-modal {
  padding: 9px 20px;
  background: var(--gold);
  border: none;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  color: var(--navy-dark);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: background 0.15s;
}
.btn-pdf-modal:hover { background: var(--gold-light); }
.btn-modal-close2 {
  padding: 9px 20px;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: inherit;
  color: var(--gray-600);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-modal-close2:hover { border-color: var(--navy); color: var(--navy); }

/* ─── DETAIL MODAL ─── */
.detail-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,20,40,0.65);
  z-index: 300;
  padding: 24px;
  overflow-y: auto;
}
.detail-overlay.show { display: block; }
.detail-modal {
  background: var(--white);
  border-radius: var(--radius-lg);
  max-width: 760px;
  margin: 0 auto;
  box-shadow: 0 8px 48px rgba(0,0,0,0.28);
  overflow: hidden;
}
.detail-header {
  background: var(--navy-dark);
  padding: 20px 24px 16px;
  border-bottom: 3px solid var(--gold);
  position: relative;
}
.detail-header-badges { display: flex; gap: 6px; margin-bottom: 8px; }
.detail-header h2 {
  font-family: 'Noto Serif JP', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--white);
  line-height: 1.3;
}
.detail-header-sub {
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  margin-top: 5px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.detail-close {
  position: absolute;
  top: 16px; right: 18px;
  background: rgba(255,255,255,0.1);
  border: none;
  color: rgba(255,255,255,0.7);
  font-size: 18px;
  width: 32px; height: 32px;
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.detail-close:hover { background: rgba(255,255,255,0.2); color: var(--white); }

.detail-body { padding: 24px; }

.detail-section { margin-bottom: 22px; }
.detail-section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--gray-200);
  display: flex;
  align-items: center;
  gap: 6px;
}
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.detail-grid-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}
.detail-item {
  background: var(--gray-50);
  border-radius: 8px;
  padding: 10px 12px;
}
.detail-item-label {
  font-size: 10px;
  color: var(--gray-400);
  font-weight: 600;
  letter-spacing: 0.08em;
  margin-bottom: 4px;
}
.detail-item-value {
  font-size: 13px;
  color: var(--gray-800);
  font-weight: 500;
  line-height: 1.5;
}
.detail-item-value.big {
  font-size: 18px;
  font-weight: 700;
  color: var(--navy);
}
.detail-item-value.accent { color: var(--gold); font-weight: 700; }

/* 選考フロー */
.selection-flow { display: flex; flex-direction: column; gap: 8px; }
.selection-step {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.step-num {
  background: var(--navy);
  color: var(--white);
  font-size: 10px;
  font-weight: 700;
  width: 20px; height: 20px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.step-content { flex: 1; }
.step-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 3px;
}
.step-subjects {
  font-size: 11px;
  color: var(--gray-600);
  line-height: 1.6;
}
.step-arrow {
  text-align: center;
  color: var(--gray-400);
  font-size: 12px;
  margin-left: 9px;
}

/* 過去データテーブル */
.past-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.past-table th {
  background: var(--navy);
  color: var(--white);
  padding: 7px 12px;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.past-table td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--gray-200);
  text-align: center;
  color: var(--gray-800);
}
.past-table tr:nth-child(even) td { background: var(--gray-50); }
.past-table td:first-child { text-align: left; font-weight: 600; color: var(--navy); }
.past-table .ratio { font-weight: 700; color: var(--navy-mid); }
.no-data {
  text-align: center;
  padding: 20px;
  color: var(--gray-400);
  font-size: 12px;
  background: var(--gray-50);
  border-radius: 8px;
}

/* タグ */
.detail-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.detail-tag {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--tag-bg);
  color: var(--tag-color);
  font-weight: 600;
}

/* 備考 */
.detail-notes {
  font-size: 12px;
  color: var(--gray-600);
  line-height: 1.8;
  background: var(--gold-pale);
  border-left: 3px solid var(--gold);
  padding: 10px 14px;
  border-radius: 0 6px 6px 0;
}

.iv-chip-y { background:var(--gold-pale); color:#8a5a00; }
.iv-chip-w { background:#fdecea; color:#a5352a; }

/* ─── EXPERIENCE MODAL ─── */
.exp-list { display: flex; flex-direction: column; gap: 10px; }
.exp-item {
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s;
}
.exp-item:hover { border-color: var(--navy); }
.exp-item-header {
  padding: 10px 14px;
  background: var(--gray-50);
  display: flex;
  align-items: center;
  gap: 8px;
}
.exp-item-title { font-size: 13px; font-weight: 500; flex: 1; }
.exp-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
.exp-item-body { padding: 10px 14px; font-size: 12px; line-height: 1.7; color: var(--gray-600); display: none; }
.exp-item.open .exp-item-body { display: block; }
.exp-item-link { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--navy); margin-top: 8px; text-decoration: none; }
.exp-empty { text-align: center; padding: 24px; color: var(--gray-400); font-size: 12px; }
/* 詳細モーダルフッタータブ */
.detail-footer-tabs {
  display: flex;
  gap: 8px;
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  background: var(--gray-50);
}
.detail-footer-tab {
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
  text-decoration: none;
  border: 1.5px solid var(--border);
  background: var(--white);
  color: var(--gray-600);
}
.detail-footer-tab:hover { border-color: var(--navy); color: var(--navy); }
.detail-footer-tab.gold { background: var(--gold); border-color: var(--gold); color: var(--navy-dark); }
.detail-footer-tab.gold:hover { background: var(--gold-light); }
.detail-footer-tab.disabled { opacity: 0.4; cursor: not-allowed; }

/* ─── EDIT MODAL ─── */
.edit-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,20,40,0.6);
  z-index: 300;
  padding: 24px;
  overflow-y: auto;
}
.edit-overlay.show { display: block; }
.edit-modal {
  background: var(--white);
  border-radius: var(--radius-lg);
  max-width: 640px;
  margin: 0 auto;
  overflow: hidden;
  box-shadow: 0 8px 48px rgba(0,0,0,0.25);
}
.edit-modal-header {
  background: var(--navy-dark);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid var(--gold);
}
.edit-modal-header h2 { color: var(--white); font-size: 14px; font-weight: 700; }
.edit-close { background: none; border: none; color: rgba(255,255,255,0.7); font-size: 20px; cursor: pointer; }
.edit-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.edit-tab {
  padding: 10px 16px;
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  border: none;
  background: transparent;
  color: var(--gray-400);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.edit-tab.active { color: var(--navy); border-bottom-color: var(--navy); }
.edit-panel { display: none; padding: 20px; }
.edit-panel.active { display: flex; flex-direction: column; gap: 14px; }
.edit-field { display: flex; flex-direction: column; gap: 5px; }
.edit-field label { font-size: 11px; font-weight: 500; color: var(--gray-600); }
.edit-field input, .edit-field select, .edit-field textarea {
  padding: 8px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: inherit;
  color: var(--gray-800);
  background: var(--white);
  transition: border-color 0.15s;
}
.edit-field input:focus, .edit-field select:focus, .edit-field textarea:focus {
  outline: none;
  border-color: var(--navy);
}
.edit-field textarea { resize: vertical; min-height: 80px; }
.edit-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.edit-tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.edit-tag-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  padding: 4px 10px;
  background: var(--tag-bg);
  color: var(--tag-color);
  border-radius: 20px;
}
.edit-tag-remove { background: none; border: none; cursor: pointer; color: var(--tag-color); font-size: 13px; line-height: 1; padding: 0; }
.edit-tag-add {
  font-size: 11px;
  padding: 4px 10px;
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: 20px;
  cursor: pointer;
  color: var(--gray-400);
  font-family: inherit;
}
.edit-round-block {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.edit-round-title { font-size: 12px; font-weight: 700; color: var(--navy); margin-bottom: 2px; }
.edit-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  background: var(--gray-50);
}
.btn-edit-delete {
  padding: 7px 14px;
  border-radius: var(--radius);
  font-size: 12px;
  font-family: inherit;
  font-weight: 700;
  background: transparent;
  border: 1.5px solid #f09595;
  color: #A32D2D;
  cursor: pointer;
}
.btn-edit-save {
  padding: 7px 18px;
  border-radius: var(--radius);
  font-size: 12px;
  font-family: inherit;
  font-weight: 700;
  background: var(--gold);
  border: none;
  color: var(--navy-dark);
  cursor: pointer;
}
.btn-edit-cancel {
  padding: 7px 14px;
  border-radius: var(--radius);
  font-size: 12px;
  font-family: inherit;
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--gray-600);
  cursor: pointer;
}
.btn-edit-mode {
  padding: 7px 14px;
  border-radius: var(--radius);
  font-size: 12px;
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
  background: rgba(255,255,255,0.1);
  border: 1.5px solid rgba(255,255,255,0.3);
  color: var(--white);
}
.btn-edit-mode:hover { background: rgba(255,255,255,0.2); }

@media print {
  header, .sidebar, .toolbar, .compare-bar, .modal-overlay { display: none !important; }
  .app-layout { grid-template-columns: 1fr; padding: 0; }
  .cards-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .uni-card { box-shadow: none; border: 1px solid var(--gray-200); break-inside: avoid; }
}
/* スケジュールPDF用 */

}
/* ══════ 面談モード PDF出力（専用ドキュメント） ══════ */
#pdfdoc { display: none; }
@media print {
  body.iv-printing > *:not(#pdfdoc) { display: none !important; }
  body.iv-printing #pdfdoc { display: block !important; }
  @page { size: A4 portrait; margin: 12mm 11mm 14mm; }
}
#pdfdoc { color:#1a1a1a; font-size:10pt; line-height:1.5; }
#pdfdoc .pd-page  { break-after: page; }
#pdfdoc .pd-page:last-child { break-after: auto; }
#pdfdoc .pd-h1    { font-size:17pt; font-weight:800; margin:0 0 2mm; }
#pdfdoc .pd-lead  { font-size:9pt; color:#555; margin:0 0 5mm; }
#pdfdoc .pd-h2    { font-size:12pt; font-weight:800; margin:0 0 3mm; padding:0 0 1.5mm; border-bottom:2px solid #1b3a5c; }
#pdfdoc .pd-note  { font-size:8.5pt; color:#555; margin:2mm 0 4mm; line-height:1.6; }
#pdfdoc table     { width:100%; border-collapse:collapse; font-size:9pt; }
#pdfdoc th,#pdfdoc td { border:1px solid #c8d0d8; padding:1.4mm 2mm; text-align:left; vertical-align:top; }
#pdfdoc th        { background:#eef2f6; font-weight:700; white-space:nowrap; }
#pdfdoc .pd-cond  { background:#f5f7fa; border:1px solid #c8d0d8; border-radius:2mm; padding:3mm 4mm; font-size:9pt; line-height:1.9; margin-bottom:5mm; }
#pdfdoc .pd-cond b { color:#1b3a5c; }
#pdfdoc .pd-kpi   { display:flex; gap:3mm; margin-bottom:5mm; }
#pdfdoc .pd-kpi > div { flex:1; border:1px solid #c8d0d8; border-radius:2mm; padding:3mm; text-align:center; }
#pdfdoc .pd-kpi span { display:block; font-size:8pt; color:#666; }
#pdfdoc .pd-kpi b { font-size:15pt; color:#1b3a5c; }
#pdfdoc .pd-uni   { break-inside: avoid; border:1px solid #c8d0d8; border-radius:2mm; padding:3mm 3.5mm; margin-bottom:3.5mm; }
#pdfdoc .pd-uni-hd{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid #dde3e9; padding-bottom:1.5mm; margin-bottom:2mm; }
#pdfdoc .pd-uni-nm{ font-size:11.5pt; font-weight:800; }
#pdfdoc .pd-uni-mt{ font-size:8.5pt; color:#666; margin-left:2mm; font-weight:400; }
#pdfdoc .pd-fee   { font-size:9pt; white-space:nowrap; }
#pdfdoc .pd-fee b { color:#1b3a5c; }
#pdfdoc .pd-chip  { display:inline-block; border:1px solid #b9c4cf; border-radius:1mm; padding:.3mm 1.6mm; font-size:8pt; margin-right:1mm; }
#pdfdoc .pd-chip-y{ background:#fff6d8; border-color:#e0c56a; }
#pdfdoc .pd-chip-r{ background:#ffe9e6; border-color:#e0938a; }
#pdfdoc .pd-chip-b{ background:#e8f0f8; border-color:#9db6cc; }
#pdfdoc .pd-warn  { margin-top:1.8mm; font-size:8.5pt; line-height:1.6; }
#pdfdoc .pd-warn div { color:#8a3324; }
#pdfdoc .pd-mon   { font-weight:800; color:#1b3a5c; background:#eef2f6; }
#pdfdoc .pd-foot  { margin-top:6mm; border-top:1px solid #c8d0d8; padding-top:2mm; font-size:7.5pt; color:#777; line-height:1.7; }
#pdfdoc .pd-clash { background:#fff6d8; }

/* ─── v1.12.0: 変更予告バナー／notes見出し分割 ─── */
.badge-upc { background:#fff3cd; color:#8a5a00; border:1px solid #f0c36d; }

.upc-title { font-size:13px; font-weight:700; color:var(--navy-dark); line-height:1.5; }

.nb-label { font-weight:700; color:var(--navy); }

// ─── STATE ───
let filteredData = [...DB.universities];
let compareList = [];
let compareMode = false;
let activeRegion = null;

// ─── INIT ───
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('header-meta').textContent = `v${DB.meta.version} ／ 最終更新：${DB.meta.last_updated} ／ 収録大学 ${DB.universities.length} 校`;
  buildTagsFilter();
  renderCards(DB.universities);
  bindEvents();
});

function buildTagsFilter() {
  const allTags = [...new Set(DB.universities.flatMap(u => u.tags))].sort();
  const wrap = document.getElementById('tags-filter');
  allTags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn';
    btn.dataset.tag = tag;
    btn.textContent = tag;
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      applyFilters();
    });
    wrap.appendChild(btn);
  });
}

function bindEvents() {
  document.getElementById('search-input').addEventListener('input', applyFilters);
  document.querySelectorAll('.filter-type, .filter-exam, .filter-lang, .filter-excl').forEach(el => {
    el.addEventListener('change', applyFilters);
  });
  document.querySelectorAll('.region-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (activeRegion === btn.dataset.region) {
        activeRegion = null;
        btn.classList.remove('active');
      } else {
        document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
        activeRegion = btn.dataset.region;
        btn.classList.add('active');
      }
      applyFilters();
    });
  });
  document.getElementById('reset-btn').addEventListener('click', resetFilters);
  document.getElementById('btn-compare-mode').addEventListener('click', toggleCompareMode);
  document.getElementById('btn-run-compare').addEventListener('click', showCompareModal);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-close2').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });
  document.getElementById('detail-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('detail-overlay')) closeDetailModal();
  });

  // ソート
  document.getElementById('sort-select').addEventListener('change', e => {
    currentSort = e.target.value;
    renderCards(filteredData);
  });

  // スケジュール
  document.getElementById('btn-iv-open').addEventListener('click', ivOpenModal);
  document.getElementById('iv-close').addEventListener('click', ivCloseModal);
  document.getElementById('iv-back').addEventListener('click', ivBack);
  document.getElementById('iv-next').addEventListener('click', () => {
    if (ivStep >= IV_STEPS.length) { ivOpenModal(); return; }
    ivNext();
  });
  document.getElementById('iv-overlay').addEventListener('click', e => {
    if (e.target.id === 'iv-overlay') ivCloseModal();
  });
  document.getElementById('btn-schedule-open').addEventListener('click', openScheduleModal);
  document.getElementById('schedule-close').addEventListener('click', () => {
    document.getElementById('schedule-overlay').classList.remove('show');
  });
  document.getElementById('schedule-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('schedule-overlay'))
      document.getElementById('schedule-overlay').classList.remove('show');
  });
  document.querySelectorAll('.schedule-view-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.schedule-view-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderSchedule(tab.dataset.view);
    });
  });

  // データ管理
  document.getElementById('btn-data-manager-open').addEventListener('click', () => openDataManager());

  // インポート関連
  document.getElementById('btn-import-open').addEventListener('click', () => {
    document.getElementById('import-overlay').classList.add('show');
  });
  document.getElementById('import-close').addEventListener('click', closeImportModal);
  document.getElementById('import-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('import-overlay')) closeImportModal();
  });

  // タブ切り替え
  document.querySelectorAll('.import-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.import-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.import-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
      resetImportStatus();
    });
  });

  // ファイル選択
  const importDrop = document.getElementById('import-drop');
  const importFileInput = document.getElementById('import-file-input');
  importDrop.addEventListener('click', () => importFileInput.click());
  importFileInput.addEventListener('change', e => {
    if (e.target.files[0]) readImportFile(e.target.files[0]);
  });
  importDrop.addEventListener('dragover', e => { e.preventDefault(); importDrop.classList.add('dragover'); });
  importDrop.addEventListener('dragleave', () => importDrop.classList.remove('dragover'));
  importDrop.addEventListener('drop', e => {
    e.preventDefault();
    importDrop.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.name.endsWith('.json')) readImportFile(file);
  });

  // テキストエリア入力
  document.getElementById('import-textarea').addEventListener('input', e => {
    parseImportJSON(e.target.value);
  });

  // 実行ボタン
  document.getElementById('btn-import-execute').addEventListener('click', executeImport);
}

// ─── IMPORT ───
let importData = null;

function closeImportModal() {
  document.getElementById('import-overlay').classList.remove('show');
  resetImportStatus();
  importData = null;
}

function resetImportStatus() {
  importData = null;
  document.getElementById('import-status').className = 'import-status';
  document.getElementById('import-preview').classList.remove('show');
  document.getElementById('btn-import-execute').disabled = true;
  document.getElementById('import-textarea').value = '';
  document.getElementById('import-file-input').value = '';
}

function showImportStatus(type, msg) {
  const el = document.getElementById('import-status');
  el.className = `import-status show ${type}`;
  el.textContent = msg;
}

function readImportFile(file) {
  const reader = new FileReader();
  reader.onload = e => parseImportJSON(e.target.result);
  reader.onerror = () => showImportStatus('error', 'ファイルの読み込みに失敗しました');
  reader.readAsText(file, 'UTF-8');
}

function parseImportJSON(text) {
  if (!text.trim()) { resetImportStatus(); return; }
  try {
    let parsed = JSON.parse(text.trim());
    // 配列でもオブジェクトでも対応
    const items = Array.isArray(parsed) ? parsed : [parsed];
    // universitiesキーがある場合（DB全体が貼られた場合）
    const universities = items[0]?.universities ? items[0].universities : items;

    if (!universities.length) {
      showImportStatus('error', 'データが空です');
      return;
    }

    // バリデーション
    const invalid = universities.filter(u => !u.university_name);
    if (invalid.length > 0) {
      showImportStatus('error', `university_nameが未設定のデータが${invalid.length}件あります`);
      return;
    }

    importData = universities;
    showImportPreview(universities);
    showImportStatus('info', `${universities.length}件のデータを検出しました。内容を確認してインポートを実行してください。`);
    document.getElementById('btn-import-execute').disabled = false;

  } catch(e) {
    showImportStatus('error', `JSONの解析に失敗しました: ${e.message}`);
    document.getElementById('btn-import-execute').disabled = true;
    importData = null;
    document.getElementById('import-preview').classList.remove('show');
  }
}

function showImportPreview(universities) {
  const preview = document.getElementById('import-preview');
  const list = document.getElementById('import-preview-list');
  const existingIds = new Set(DB.universities.map(u => u.id));
  const existingNames = new Set(DB.universities.map(u => u.university_name));

  list.innerHTML = universities.map(u => {
    const isNew = !existingIds.has(u.id) && !existingNames.has(u.university_name);
    const type = isNew ? 'new' : 'update';
    const label = isNew ? '新規' : '更新';
    const cats = u.exam_category ? u.exam_category.join('・') : '—';
    return `
      <div class="import-preview-item ${type}">
        <span class="badge">${label}</span>
        <span>${u.university_name || u.id}</span>
        <span style="font-size:10px;color:var(--gray-400);margin-left:auto;">${cats}</span>
      </div>
    `;
  }).join('');

  preview.classList.add('show');
}

function executeImport() {
  if (!importData) return;
  const mode = document.querySelector('input[name="import-mode"]:checked').value;

  if (mode === 'replace') {
    if (!confirm(`現在の全データ（${DB.universities.length}校）を削除して、新しいデータ（${importData.length}校）に完全置換します。よろしいですか？`)) return;
    DB.universities = importData;
  } else {
    // マージ：university_nameかidが一致したら更新、なければ追加
    importData.forEach(newU => {
      const idx = DB.universities.findIndex(u =>
        (newU.id && u.id === newU.id) || u.university_name === newU.university_name
      );
      if (idx >= 0) {
        DB.universities[idx] = { ...DB.universities[idx], ...newU };
      } else {
        DB.universities.push(newU);
      }
    });
  }

  // 更新日を記録
  DB.meta.last_updated = new Date().toISOString().slice(0, 10);

  // 画面を再構築
  filteredData = [...DB.universities];
  document.getElementById('header-meta').textContent =
    `v${DB.meta.version} ／ 最終更新：${DB.meta.last_updated} ／ 収録大学 ${DB.universities.length} 校`;

  // タグフィルターを再構築
  document.getElementById('tags-filter').innerHTML = '';
  buildTagsFilter();

  // フィルターリセットして再描画
  resetFilters();
  closeImportModal();

  // 成功通知
  const msg = mode === 'replace'
    ? `完全置換完了：${DB.universities.length}校のデータを読み込みました`
    : `インポート完了：${importData.length}件を追加・更新しました（合計${DB.universities.length}校）`;
  alert(msg);
}


/* ══════════ 面談モード ══════════ */
const IV_REGIONS = ['北海道','東北','関東','中部','近畿','中国','四国','九州・沖縄'];
let ivState = null;
let ivStep = 0;
let ivResult = null;

function ivDefaultState() {
  return { cats:['両方見る'], load:'any', subj:['英語','数学','理科'], ib:null, ibs:null,
           ct:'any', eng:'any', excl:'any', regions:['指定しない'] };
}

/* 各ラウンドを1件ずつ展開 */
function ivRounds() {
  const out = [];
  DB.universities.forEach(u => {
    ['kikoku','ib'].forEach(k => {
      const b = u[k];
      if (!b || !b.rounds) return;
      b.rounds.forEach(r => {
        out.push({ u, blk:b, r, cat: (k === 'ib' ? 'IB' : '帰国生') });
      });
    });
  });
  return out;
}

/* ══ 年度判定はすべて DB.meta.target_year から導出する ══
   target_year=2027 なら 2027年4月入学サイクル＝2026-04-01〜2027-03-31 が「今年度」。
   来年の切り替えは DB.meta.target_year を1つ書き換えるだけでよい。 */
function tgtYear()    { return (DB.meta && DB.meta.target_year) || 2027; }
function cycleStart() { return (tgtYear() - 1) + '-04-01'; }
function isOldRound(r){ return !!(r && r.guideline_year && r.guideline_year < tgtYear()); }
function isOldDate(iso){ return !!iso && iso < cycleStart(); }

/* 英語外部試験の提出が出願要件か。required 未設定は必須扱い（後方互換） */
function ivEngLevel(blk) {
  const er = blk && blk.english_requirement;
  if (!er) return 'none';
  if (er.required === false) return 'optional';
  if (er.required === 'conditional') return 'conditional';
  return 'required';
}
function ivEngRequired(blk) { return ivEngLevel(blk) === 'required'; }

/* この選抜が大学入学共通テストを課すか */
function ivNeedsCT(blk) {
  return ((blk && blk.selection_methods) || []).join('').indexOf('共通テスト') >= 0;
}
/* 試験の型：exam_load から導出。未設定は 'unknown' */
function ivLoadType(el) {
  if (!el) return 'unknown';
  if (el.english || el.math || el.science) return 'academic';
  if (el.essay) return 'essay';
  return 'interview';
}

/* 1ラウンドが条件に合致するか。skip で指定したキーの条件は無視（選択肢別件数の算出用） */
function ivMatch(x, st, skip) {
  const el = x.r.exam_load;
  const t  = ivLoadType(el);

  if (skip !== 'cats' && !st.cats.includes('両方見る') && !st.cats.includes(x.cat)) return false;

  if (skip !== 'load' && st.load !== 'any') {
    if (t !== 'unknown') {
      if (st.load === 'interview' && t !== 'interview') return false;
      if (st.load === 'essay' && !(t === 'interview' || t === 'essay')) return false;
    }
  }
  /* 科目サブステップ：学科ありを選んだ場合のみ効く。未確認は常に通す */
  if (skip !== 'subj' && st.load === 'academic' && t === 'academic' && el) {
    if (!st.subj.includes('英語') && el.english) return false;
    if (!st.subj.includes('数学') && el.math)    return false;
    if (!st.subj.includes('理科') && el.science) return false;
  }
  if (skip !== 'ib' && st.ib !== null) {
    const min = x.blk.ib_score_min;
    if (x.cat === 'IB' && min && min > st.ib) return false;
  }
  if (skip !== 'ibs' && st.ibs && x.cat === 'IB' && !ivIbsCheck(x.r.ib_subject_req, st.ibs)) return false;
  if (skip !== 'ct' && st.ct === 'no' && ivNeedsCT(x.blk)) return false;
  if (skip !== 'eng' && st.eng === 'no' && ivEngRequired(x.blk)) return false;
  if (skip !== 'excl' && st.excl === 'yes' && x.u.exclusive) return false;
  if (skip !== 'regions' && !st.regions.includes('指定しない') && !st.regions.includes(x.u.region)) return false;
  return true;
}

function ivCountUnis(st, skip) {
  const set = {};
  ivRounds().forEach(x => { if (ivMatch(x, st, skip)) set[x.u.id] = 1; });
  return Object.keys(set).length;
}

/* 選択肢を仮に当てた場合の件数 */
function ivTrial(key, val) {
  const st = JSON.parse(JSON.stringify(ivState));
  if (key === 'cats' || key === 'regions') st[key] = [val];
  else if (key === 'subj') { st.subj = ivState.subj.slice(); }
  else st[key] = val;
  return ivCountUnis(st);
}

    opts:[['受験する・受験できる','yes'],['受験しない','no'],['まだ決めていない','any']] },

  { key:'regions', type:'multi', q:'地域の希望はありますか', sub:'複数選べます',
    opts:['指定しない'].concat(IV_REGIONS) }
];

/* STEP をスキップすべきか */
function ivSkip(i) {
  const st = IV_STEPS[i];
  if (st.key === 'subj') return ivState.load !== 'academic';
  /* 共通テストも学科試験の一種。学科試験を受けない前提の人には尋ねない */
  if (st.key === 'ct')   return ivState.load !== 'academic';
  if (st.key === 'ib' || st.key === 'ibs') return !(ivState.cats.includes('IB') || ivState.cats.includes('両方見る'));
  return false;
}


/* ══ v1.13.0: IB履修科目（HL/SL）による判定 ══ */
const IV_IBS_ROWS = [
  ['ja','日本語',[['A HL','A_HL'],['A SL','A_SL'],['B HL','B_HL'],['B SL','B_SL'],['履修なし（日本語が母語）','NATIVE'],['履修なし（母語ではない）','NONE']]],
  ['en','英語',[['A HL','A_HL'],['A SL','A_SL'],['B HL','B_HL'],['B SL','B_SL'],['履修なし','NONE']]],
  ['math','数学',[['AA HL','AA_HL'],['AA SL','AA_SL'],['AI HL','AI_HL'],['AI SL','AI_SL']]],
  ['phy','物理',[['HL','HL'],['SL','SL'],['履修なし','NONE']]],
  ['chem','化学',[['HL','HL'],['SL','SL'],['履修なし','NONE']]],
  ['bio','生物',[['HL','HL'],['SL','SL'],['履修なし','NONE']]]
];
function ivIbsEmpty() { return { ja:null, en:null, math:null, phy:null, chem:null, bio:null }; }
function ivIbsAny(s) { return !!s && Object.keys(s).some(k => s[k]); }
function ivSetIbs(k, v) {
  if (!ivState.ibs) ivState.ibs = ivIbsEmpty();
  ivState.ibs[k] = (ivState.ibs[k] === v) ? null : v;
  if (!ivIbsAny(ivState.ibs)) ivState.ibs = null;
  ivRender();
}
function ivClearIbs() { ivState.ibs = null; ivRender(); }
/* 日本語の代替要件で通しているか */
function ivIbsJaAlt(req, s) {
  return !!(req && req.japanese && s && s.ja && req.japanese.accept.indexOf(s.ja) < 0 && req.japanese.alt);
}
/* 履修科目が出願要件を満たすか。未入力の項目・要件未設定は通す */
function ivIbsCheck(req, s) {
  if (!req || !ivIbsAny(s)) return true;
  if (req.japanese && s.ja && req.japanese.accept.indexOf(s.ja) < 0 && !req.japanese.alt) return false;
  if (req.english && s.en && req.english.accept.indexOf(s.en) < 0) return false;
  if (req.math && s.math) {
    const p = s.math.split('_');
    if (req.math.levels.indexOf(p[1]) < 0) return false;
    if (req.math.course && req.math.course.indexOf(p[0]) < 0) return false;
  }
  const sc = [s.phy, s.chem, s.bio];
  if (sc.some(v => v)) {
    const taken = sc.filter(v => v === 'HL' || v === 'SL');
    const hl = Math.min(2, taken.filter(v => v === 'HL').length);  /* HLが多くなる2科目で判定 */
    if (req.science) {
      if (taken.length < req.science.count) return false;
      if (hl < (req.science.hl_min || 0)) return false;
    }
    if (req.msc_hl_min && s.math) {
      if (taken.length < 2) return false;
      if ((s.math.slice(-2) === 'HL' ? 1 : 0) + hl < req.msc_hl_min) return false;
    }
  }
  return true;
}
function ivIbsLabel(s) {
  if (!ivIbsAny(s)) return null;
  const out = [];
  IV_IBS_ROWS.forEach(row => {
    const v = s[row[0]]; if (!v) return;
    const o = row[2].find(p => p[1] === v);
    out.push(row[1] + (o ? (o[0].indexOf('履修なし') === 0 ? '：' + o[0] : ' ' + o[0]) : ''));
  });
  return out.join('・');
}
function ivIbsHTML() {
  const s = ivState.ibs || ivIbsEmpty();
  let h = '';
  IV_IBS_ROWS.forEach(row => {
    h += '<div class="iv-ibs-row"><div class="iv-ibs-lbl">' + row[1] + '</div><div class="iv-ibs-chips">';
    row[2].forEach(p => {
      h += '<button class="iv-cb' + (s[row[0]] === p[1] ? ' sel' : '') + '" onclick="ivSetIbs(\'' + row[0] + '\',\'' + p[1] + '\')">' + ivEsc(p[0]) + '</button>';
    });
    h += '</div></div>';
  });
  h += ivOptHTML(!ivIbsAny(ivState.ibs), 'わからない・指定しない', ivTrial('ibs', null), 'ivClearIbs()', false);
  return h;
}

function ivOpenModal() {
  ivState = ivDefaultState();
  ivStep = 0; ivResult = null;
  document.getElementById('iv-overlay').classList.add('show');
  ivRender();
}
function ivCloseModal() {
  document.getElementById('iv-overlay').classList.remove('show');
}

function ivToggleMulti(key, val, wildcard) {
  const arr = ivState[key];
  if (val === wildcard) { ivState[key] = [wildcard]; }
  else {
    const wi = arr.indexOf(wildcard); if (wi >= 0) arr.splice(wi, 1);
    const vi = arr.indexOf(val);
    if (vi >= 0) arr.splice(vi, 1); else arr.push(val);
    if (!arr.length) ivState[key] = [wildcard];
  }
  ivRender();
}
function ivToggleSubj(val) {
  const a = ivState.subj, i = a.indexOf(val);
  if (i >= 0) { if (a.length > 1) a.splice(i, 1); } else a.push(val);
  ivRender();
}
function ivPickSingle(key, val) {
  ivState[key] = val;
  if (key === 'load' && val !== 'academic') ivState.subj = ['英語','数学','理科'];
  ivNext();
}
function ivSetIB(v) { ivState.ib = v; ivRender(); }

function ivNext() {
  let i = ivStep + 1;
  while (i < IV_STEPS.length && ivSkip(i)) i++;
  ivStep = i; ivRender();
}
function ivBack() {
  if (ivStep > IV_STEPS.length) { ivStep = IV_STEPS.length - 1; while (ivStep > 0 && ivSkip(ivStep)) ivStep--; ivRender(); return; }
  let i = ivStep - 1;
  while (i > 0 && ivSkip(i)) i--;
  if (i < 0) i = 0;
  ivStep = i; ivRender();
}

function ivEsc(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function ivOptHTML(sel, label, count, onclick, dis) {
  return '<button class="iv-opt' + (sel ? ' sel' : '') + '"' + (dis ? ' disabled' : '') +
    ' onclick="' + onclick + '"><span>' + ivEsc(label) + '</span>' +
    '<span class="iv-opt-count">' + count + ' 校</span></button>';
}

function ivRender() {
  const body = document.getElementById('iv-body');
  const lbl  = document.getElementById('iv-step-label');
  const bar  = document.getElementById('iv-progress-bar');
  const back = document.getElementById('iv-back');
  const next = document.getElementById('iv-next');
  const pdf  = document.getElementById('iv-pdf');

  if (ivStep >= IV_STEPS.length) { ivRenderResult(); return; }

  document.getElementById('iv-title').textContent = '面談モード';
  pdf.style.display = 'none';

  const visible = IV_STEPS.filter((_, i) => !ivSkip(i)).length;
  const done    = IV_STEPS.filter((_, i) => i < ivStep && !ivSkip(i)).length;
  lbl.textContent = 'STEP ' + (done + 1) + ' / ' + visible;
  bar.style.width = Math.round(done / visible * 100) + '%';
  back.disabled = (done === 0);
  next.textContent = (done + 1 === visible) ? '結果を見る' : '次へ';
  next.disabled = false;

  const st = IV_STEPS[ivStep];
  let h = '';

  if (st.type === 'multi') {
    const wc = st.opts[0];
    if (st.key === 'subj') {
      st.opts.forEach(o => {
        const sel = ivState.subj.indexOf(o) >= 0;
        const trial = JSON.parse(JSON.stringify(ivState));
        trial.subj = sel ? ivState.subj.filter(v => v !== o) : ivState.subj.concat([o]);
        if (!trial.subj.length) trial.subj = [o];
        h += ivOptHTML(sel, o, ivCountUnis(trial), "ivToggleSubj('" + o + "')", false);
      });
    } else {
      st.opts.forEach(o => {
        const sel = ivState[st.key].indexOf(o) >= 0;
        const c = ivTrial(st.key, o);
        h += ivOptHTML(sel, o, c, "ivToggleMulti('" + st.key + "','" + o + "','" + wc + "')", c === 0 && !sel);
      });
    }
  } else if (st.type === 'single') {
    st.opts.forEach(pair => {
      const sel = ivState[st.key] === pair[1];
      const c = ivTrial(st.key, pair[1]);
      h += ivOptHTML(sel, pair[0], c, "ivPickSingle('" + st.key + "','" + pair[1] + "')", c === 0 && !sel);
    });
  } else if (st.type === 'ibsubj') {
    h += ivIbsHTML();
  } else if (st.type === 'slider') {
    const cur = ivState.ib === null ? 40 : ivState.ib;
    const MIN = 24, MAX = 45;
    /* つまみの半径ぶん内側に寄せて位置を合わせる */
    const pos = v => 'calc(9px + (100% - 18px) * ' + ((v - MIN) / (MAX - MIN)).toFixed(4) + ')';
    let sc = '';
    for (let v = MIN; v <= MAX; v++) {
      const maj = (v === MIN || v === MAX || v % 5 === 0);
      sc += '<i class="' + (maj ? 'maj' : '') + '" style="left:' + pos(v) + '"></i>';
      if (maj) sc += '<b style="left:' + pos(v) + '">' + v + '</b>';
    }
    h += '<div class="iv-slider-row"><div class="iv-slider-wrap">' +
         '<input type="range" min="' + MIN + '" max="' + MAX + '" step="1" value="' + cur +
         '" oninput="ivSetIB(Number(this.value))">' +
         '<div class="iv-scale">' + sc + '</div></div>' +
         '<span class="iv-slider-val">' + (ivState.ib === null ? '—' : cur) + '</span></div>';
    h += ivOptHTML(ivState.ib === null, 'わからない・指定しない', ivTrial('ib', null), 'ivSetIB(null)', false);
  }

  h += '<div class="iv-live">条件に合う大学　<b>' + ivCountUnis(ivState) + '</b> 校</div>';
  let sub = st.sub;
  if (st.key === 'ib' && !sub) {
    const n = DB.universities.filter(u => u.ib && u.ib.ib_score_min).length;
    sub = '出願にスコアの下限を設けている大学は' + n + '校です。基準のない大学はここで絞り込まれません';
  }
  body.innerHTML = '<div class="iv-q">' + ivEsc(st.q) + '</div>' +
                   (sub ? '<div class="iv-sub">' + ivEsc(sub) + '</div>' : '') + h;
}

/* 学費を「約○○万円」に丸める（共通） */
function feeMan(yen) { return Math.round(yen / 10000).toLocaleString(); }
function feeShort(u) {
  const t = u.tuition;
  if (t && t.total_6years) return '6年 約' + feeMan(t.total_6years) + '万円';
  if (u.tuition_annual) return '年 約' + feeMan(u.tuition_annual) + '万円';
  return '学費 未収録';
}
function feeLong(u) {
  const t = u.tuition;
  if (!t || !t.total_6years) {
    return u.tuition_annual ? feeMan(u.tuition_annual) + '万円／年' : '学費データ未収録';
  }

/* ══════════ 面談モード PDF出力 ══════════ */
const PD_W = ['日','月','火','水','木','金','土'];
function pdD(iso) {                       /* 2026-11-08 → 11/8（日） */
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return (d.getMonth() + 1) + '/' + d.getDate() + '（' + PD_W[d.getDay()] + '）';
}
function pdDiff(a, b) {                   /* 日数差 */
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}
function pdMan(n) {                       /* 円 → 「◯◯万円」 */
  return n == null ? '—' : (Math.round(n / 1000) / 10).toLocaleString() + '万円';
}
/* 昨年度データは並べ替え・グルーピングのみ1年ずらして今年度サイクルに揃える（表示は実日付＋「昨年度」） */
function pdKey(iso) {
  if (!iso) return null;
  return isOldDate(iso) ? (Number(iso.slice(0, 4)) + 1) + iso.slice(4) : iso;
}
function pdShow(iso) {
  if (!iso) return '未確認';
  return isOldDate(iso) ? Number(iso.slice(5, 7)) + '/' + Number(iso.slice(8, 10)) + '（昨年度）' : pdD(iso);
}
function pdRange(o) {
  if (!o) return '未確認';
  if (o.start && o.end) return pdD(o.start) + ' 〜 ' + pdD(o.end);
  if (o.end)   return '〜 ' + pdD(o.end);
  if (o.start) return pdD(o.start) + ' 〜';
  return '未確認';
}
/* 該当ラウンドを平坦化 */
function pdRows() {
  const out = [];
  (ivResult || []).forEach(g => g.rows.forEach(x => {
    const r = x.r, dd = r.dates || {};
    out.push({
      u: g.u, cat: x.cat, r: r, dd: dd,
      old: isOldRound(r),
      exams: (dd.exam || []).map(e => e.date).filter(Boolean).sort(),
      resEnd: (dd.result || []).map(e => e.date).filter(Boolean).sort().slice(-1)[0] || null,
      enrEnd: (dd.enrollment || {}).end || null
    });
    const z = out[out.length - 1];
    z.kExams = z.exams.map(pdKey);
    z.kRes   = pdKey(z.resEnd);
    z.kEnr   = pdKey(z.enrEnd);
  }));
  return out;
}
/* 1ラウンドあたりの注意書き（構造化データから機械的に生成） */
function pdWarn(x) {
  const w = [];
  if (x.dd.pre_check) w.push('出願資格の事前確認 締切 ' + pdShow(x.dd.pre_check.date) + '　※これを逃すと出願できません');
  if (x.old) w.push('前年度の日程を含みます。' + tgtYear() + '年度の要項が公表され次第、必ず確認してください');
  if (!x.enrEnd) w.push('入学手続期限が未確認です');
  else if (x.resEnd) {
    /* 年度混在（発表は今年度・手続は昨年度 等）でも比較できるよう、1年ずれ補正済みのキーで差を取る */
    const d = pdDiff(x.kRes, x.kEnr);
    const mixed = isOldDate(x.enrEnd) !== isOldDate(x.resEnd);
    if (d >= 0 && d <= 10) {
      w.push('合格発表から入学手続締切まで ' + (mixed ? '約' : '') + d + '日間（納入判断の猶予が短い）' +
             (mixed ? '　※入学手続は昨年度の日程からの概算' : ''));
    }
  }
  if (x.kExams.length && x.kRes) {
    const ke = x.kExams.slice().sort();
    const d = pdDiff(ke[ke.length - 1], x.kRes);
    if (d >= 45) w.push('試験から合格発表まで 約' + Math.round(d / 7) + '週間空きます');
  }
  if (x.u.exclusive) w.push('専願（合格した場合は入学を確約）');
  return w;
}
function pdSubjChips(el) {
  if (!el) return '<span class="pd-chip">要確認</span>';
  const m = [['english','英語'],['math','数学'],['science','理科'],['essay','小論文'],['interview','面接'],['presentation','プレゼン']];
  const on = m.filter(p => el[p[0]]).map(p => '<span class="pd-chip pd-chip-b">' + p[1] + '</span>').join('');
  return on || '<span class="pd-chip">書類審査のみ</span>';

/* ── 2枚目：受験カレンダー ── */
function pdCalendar() {
  const ev = {};
  pdRows().forEach(x => {
    const nm = x.u.university_name + '（' + x.cat + (x.r.round_name !== '通常募集' ? '・' + x.r.round_name : '') + '）';
    /* ［昨年度］は日付ごとに付ける（試験日だけ新年度が確定している大学があるため） */
    const add = (d, t) => { if (!d) return; const k = pdKey(d);
      (ev[k.slice(0, 7)] = ev[k.slice(0, 7)] || []).push(
        { d: d, k: k, t: t, n: nm + (isOldDate(d) ? '［昨年度］' : '') }); };
    if (x.dd.pre_check) add(x.dd.pre_check.date, '事前確認締切');
    if ((x.dd.application || {}).start) add(x.dd.application.start, '出願開始');
    if ((x.dd.application || {}).end)   add(x.dd.application.end,   '出願締切');
    (x.dd.exam || []).forEach(e => add(e.date, e.label || '試験'));
    (x.dd.result || []).forEach(e => add(e.date, e.label || '発表'));
    if (x.enrEnd) add(x.enrEnd, '入学手続 締切');
  });
  const months = Object.keys(ev).sort();
  let h = '<div class="pd-page"><div class="pd-h2">受験カレンダー</div>';
  h += '<div class="pd-note">出願・試験・発表・入学手続の締切を時系列に並べたものです。★は特に見落としやすい締切です。</div>';
  if (!months.length) { h += '<div class="pd-note">日程データがありません。</div></div>'; return h; }

  months.forEach(mo => {

    list.forEach((e, i) => {
      const star = /事前確認|入学手続/.test(e.t) ? '★' : '';
      h += '<tr>' + (i === 0 ? '<td class="pd-mon" rowspan="' + list.length + '">' +
           mo.slice(0, 4) + '年<br>' + Number(mo.slice(5, 7)) + '月</td>' : '') +
           '<td>' + pdShow(e.d) + '</td><td>' + star + ivEsc(e.t) + '</td><td>' + ivEsc(e.n) + '</td></tr>';
    });
  });
  h += '</table></div>';
  return h;
}
/* ── 3枚目：意思決定タイムライン＋一時帰国ウィンドウ ── */
function pdDecision() {
  const rows = pdRows();
  const pays = rows.filter(x => x.enrEnd).sort((a, b) => a.kEnr < b.kEnr ? -1 : 1);
  let h = '<div class="pd-page"><div class="pd-h2">お金の判断が必要になる日</div>';
  if (!pays.length) {
    h += '<div class="pd-note">入学手続期限が確認できている大学がありません。</div>';
  } else {
    const first = pays[0].kEnr;
    const later = rows.filter(x => x.kRes && x.kRes > first)
                      .sort((a, b) => a.kRes < b.kRes ? -1 : 1);
    h += '<div class="pd-note">合格しても、入学手続の締切までに学費を納めなければ入学できません。' +
         '下表は「いつまでに、いくら納める判断が必要か」の一覧です。網掛けの行は、' +
         'その時点でまだ結果が出ていない大学がある（＝他校の合否を知らないまま納入判断が必要になる）ことを示します。</div>';
    h += '<table><tr><th style="width:22mm;">手続締切</th><th>大学（区分）</th><th style="width:24mm;">初年度納入</th><th style="width:46mm;">この時点で未発表の大学</th></tr>';
    pays.forEach(x => {
      const pend = rows.filter(y => y.kRes && y.kRes > x.kEnr && y.u.id !== x.u.id)
                       .map(y => y.u.university_name).filter((v, i, a) => a.indexOf(v) === i);
      h += '<tr class="' + (pend.length ? 'pd-clash' : '') + '"><td>' + pdShow(x.enrEnd) + '</td>' +
           '<td>' + ivEsc(x.u.university_name) + '（' + ivEsc(x.cat) + '）</td>' +
           '<td>' + pdMan((x.u.tuition || {}).first_year) + '</td>' +
           '<td style="font-size:8pt;">' + (pend.length ? ivEsc(pend.slice(0, 6).join('、')) + (pend.length > 6 ? ' ほか' : '') : '—') + '</td></tr>';
    });
    h += '</table>';
    if (later.length) {
      h += '<div class="pd-note" style="color:#8a3324;">★ 最も早い入学手続締切は ' + pdShow(pays[0].enrEnd) +

           '併願する場合、先に納めた学費が戻るかどうかは大学ごとに条件が大きく異なります。必ず各大学の返還規定をご確認ください。</div>';
    }
  }
  /* 一時帰国ウィンドウ */
  const ds = [];
  rows.forEach(x => x.exams.forEach(d => ds.push({ d: d, k: pdKey(d), n: x.u.university_name + '（' + x.cat + '）' })));
  ds.sort((a, b) => a.k < b.k ? -1 : 1);
  const cl = [];
  ds.forEach(e => {
    const last = cl[cl.length - 1];
    /* 試験間隔10日以内かつ滞在が通算21日以内のときだけ同じ帰国にまとめる */
    if (last && pdDiff(last.kEnd, e.k) <= 10 && pdDiff(last.kStart, e.k) <= 21) { last.kEnd = e.k; last.end = e; last.items.push(e); }
    else cl.push({ start: e, end: e, kStart: e.k, kEnd: e.k, items: [e] });
  });
  h += '<div class="pd-h2" style="margin-top:7mm;">一時帰国の目安</div>';
  h += '<div class="pd-note">試験日が近いものをまとめました。1回の帰国でまとめて受験できる組み合わせの目安です。' +
       '試験の間隔が10日以内で、かつ滞在が通算3週間以内に収まる範囲でまとめています。前後の移動日・時差調整は含めていません。</div>';
  if (!cl.length) { h += '<div class="pd-note">試験日データがありません。</div>'; }
  else {
    h += '<table><tr><th style="width:34mm;">滞在の目安</th><th style="width:14mm;">日数</th><th>受験できる入試</th></tr>';
    cl.forEach(c => {

           '<td>' + (pdDiff(c.kStart, c.kEnd) + 1) + '日</td>' +

      h += '<div style="margin-top:1.2mm;">試験内容　' + pdSubjChips(r.exam_load) +
           (blk.ib_score_min ? '<span class="pd-chip pd-chip-r">IB ' + blk.ib_score_min + '点以上</span>' : '') +
           ({ required:    '<span class="pd-chip pd-chip-r">英語資格 必須</span>',
              conditional: '<span class="pd-chip pd-chip-r">英語資格 条件付で必須</span>',
              optional:    '<span class="pd-chip">英語資格 任意提出</span>',
              none:        '' }[ivEngLevel(blk)]) +
           (ivNeedsCT(blk) ? '<span class="pd-chip pd-chip-r">共通テストが必要</span>' : '') + '</div>';
      const q = (x.cat === 'IB') ? r.ib_subject_req : null;
      if (q && (q.grade_text || q.note || ivIbsJaAlt(q, ivState && ivState.ibs))) {
        h += '<div class="pd-warn">' +
             (q.grade_text ? '<div>IB成績条件：' + ivEsc(q.grade_text) + '</div>' : '') +
             (ivIbsJaAlt(q, ivState && ivState.ibs) ? '<div>日本語は代替要件で出願：' + ivEsc(q.japanese.alt) + '</div>' : '') +
             (q.note ? '<div>' + ivEsc(q.note) + '</div>' : '') + '</div>';
      }
      const w = pdWarn(x);
      if (w.length) h += '<div class="pd-warn">' + w.slice(0, 3).map(t => '<div>★ ' + ivEsc(t) + '</div>').join('') + '</div>';
      h += '</div>';
    });
    h += '</div>';
  });
  h += '<div class="pd-foot">本資料は MEDICAL DIG が大学公表の募集要項・選抜要項をもとに作成した面談用の参考資料です。' +
       '記載内容には変更の可能性があります。出願にあたっては必ず各大学の最新の募集要項をご確認ください。</div>';
  h += '</div>';
  return h;
}
function printInterview() {

function applyFilters() {
  const keyword = document.getElementById('search-input').value.toLowerCase();
  const types = [...document.querySelectorAll('.filter-type:checked')].map(e => e.value);
  const exams = [...document.querySelectorAll('.filter-exam:checked')].map(e => e.value);
  const langs = [...document.querySelectorAll('.filter-lang:checked')].map(e => e.value);
  const excls = [...document.querySelectorAll('.filter-excl:checked')].map(e => e.value);
  const tags = [...document.querySelectorAll('.tag-btn.active')].map(b => b.dataset.tag);

  filteredData = DB.universities.filter(u => {
    if (keyword && !u.university_name.toLowerCase().includes(keyword) &&
        !u.prefecture.toLowerCase().includes(keyword)) return false;
    if (activeRegion && u.region !== activeRegion) return false;
    if (types.length && !types.includes(u.type)) return false;
    if (exams.length && !exams.some(e => u.exam_category.includes(e))) return false;
    if (langs.length && !langs.includes(u.exam_language)) return false;
    if (excls.length && !excls.includes(String(u.exclusive))) return false;
    if (tags.length && !tags.every(t => u.tags.includes(t))) return false;
    return true;
  });

  renderCards(filteredData);
}

function resetFilters() {
  document.getElementById('search-input').value = '';
  document.querySelectorAll('.filter-type, .filter-exam, .filter-lang, .filter-excl').forEach(e => e.checked = false);
  document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
  activeRegion = null;
  filteredData = [...DB.universities];
  renderCards(filteredData);
}

function renderCards(data) {
  const grid = document.getElementById('cards-grid');

  const sorted = sortData(data);

    const ibR = getFirstRound(u.ib);
    const primarySection = u.kikoku || u.ib;

    const exclusiveText = u.exclusive ? '専願' : '併願可';

    card.innerHTML = `

      <div class="card-header">

          <div class="info-item">

          </div>

            <div class="info-item-label">出願期間</div>

          <div class="info-item">

// ─── v1.12.0: notes を【見出し】単位のブロックに分割して表示 ───
function nbEsc(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nbBody(body) {
  let src = '';
  const si = body.indexOf('出典：');
  if (si >= 0) { src = body.slice(si); body = body.slice(0, si); }
  const segs = body.split('★');
  let html = '';
  if (segs[0].trim()) html += `<div>${nbEsc(segs[0].trim())}</div>`;
  for (let i = 1; i < segs.length; i++) {
    if (segs[i].trim()) html += `<div class="nb-star">★${nbEsc(segs[i].trim())}</div>`;
  }
  if (src) html += `<div class="nb-src">${nbEsc(src.trim())}</div>`;
  return html;
}
function renderNotes(text) {
  if (!text) return '';
  const parts = String(text).replace(/★【/g, '【★').split(/(?=【[^】]{1,24}】)/);
  let out = '';
  parts.forEach(p => {
    if (!p.trim()) return;
    const m = p.match(/^【([^】]+)】([\s\S]*)$/);
    if (!m) {
      out += `<div class="nb-lead">${nbEsc(p.trim())}</div>`;
      return;
    }
    const warn = /要確認|重要|注意|^★/.test(m[1]);
    out += `<div class="nb-block${warn ? ' nb-warn' : ''}"><div class="nb-label">${nbEsc(m[1])}</div><div>${nbBody(m[2])}</div></div>`;
  });
  return `<div class="nb-wrap">${out}</div>`;
}

function toggleCompareMode() {
  compareMode = !compareMode;
  const btn = document.getElementById('btn-compare-mode');
  if (compareMode) {
    btn.style.background = 'var(--navy)';
    btn.style.color = 'var(--white)';
    btn.textContent = '✓ 比較モード中';
  } else {
    btn.style.background = '';
    btn.style.color = '';
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18"/><rect x="14" y="3" width="7" height="18"/></svg> 比較モード`;
  }
}

function toggleCompareSelect(u, card) {
  const idx = compareList.findIndex(c => c.id === u.id);
  if (idx >= 0) {
    compareList.splice(idx, 1);
    card.classList.remove('selected');
  } else {
    if (compareList.length >= 4) { alert('比較できるのは最大4校です'); return; }
    compareList.push(u);
    card.classList.add('selected');
  }
  updateCompareBar();
}

function updateCompareBar() {
  const bar = document.getElementById('compare-bar');
  const pills = document.getElementById('compare-pills');
  if (compareList.length === 0) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  pills.innerHTML = compareList.map(u => `
    <span class="compare-pill">
      ${u.university_name}
      <button onclick="removeFromCompare('${u.id}')">✕</button>
    </span>
  `).join('');
}

function removeFromCompare(id) {
  compareList = compareList.filter(u => u.id !== id);
  document.querySelectorAll('.uni-card').forEach(card => {
    if (card.dataset.id === id) card.classList.remove('selected');
  });
  updateCompareBar();
}

function showCompareModal() {

    ['都道府県', u => u.prefecture],
    ['地方', u => u.region],
    ['入試区分', u => u.exam_category.join('・')],
    ['IB基準点', u => u.ib_score_min ? `${u.ib_score_min}点以上` : '基準なし'],
    ['試験言語', u => u.exam_language],

    ['出願期間', u => u.application_period || '—'],

// 選択内容からスケジュール構築
function buildScheduleFromSelection() {
  const checks = document.querySelectorAll('.sch-check:checked');
  if (checks.length === 0) { alert('大学・入試種別を選択してください'); return; }

  // 選択されたキーを収集
  const selectedKeys = new Set([...checks].map(c => c.dataset.key));

  // イベント収集
  const selected = [];
  DB.universities.forEach(u => {
    ['kikoku','ib'].forEach(sec => {
      const key = u.id + '_' + sec;
      if (!selectedKeys.has(key)) return;
      const s = u[sec];
      if (!s || !s.rounds) return;
      const label = sec === 'kikoku' ? '帰国生' : 'IB';
      s.rounds.forEach(r => {
        selected.push({ u, sec, label, r });
      });
    });
  });

  // セレクターを閉じてモーダルを開く
  document.getElementById('schedule-selector-overlay').remove();
  renderSchedule('monthly', selected);
  document.getElementById('schedule-overlay').classList.add('show');
}

function renderSchedule(view, selectedEvents) {
  // selectedEventsがなければ現在のものを再利用（タブ切替用）
  if (!selectedEvents) {
    selectedEvents = window._scheduleData || [];
  } else {
    window._scheduleData = selectedEvents;
  }

  const body = document.getElementById('schedule-body');

  // タブの表示状態を更新
  document.querySelectorAll('.schedule-view-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === view);
  });

  // 全イベントを収集
  const events = [];
  selectedEvents.forEach(({ u, label, r }) => {
    const uniLabel = `${u.university_name}（${label}）${r.round_name !== '通常募集' ? '　' + r.round_name : ''}`;
    if (r.application_start_sort && r.application_start_sort !== 'null') {
      events.push({ date: r.application_start_sort, uni: uniLabel, uniShort: u.university_name, type: 'app', typeLabel: '出願開始', detail: r.application_period });
    }
    if (r.exam_date_sort && r.exam_date_sort !== 'null') {
      events.push({ date: r.exam_date_sort, uni: uniLabel, uniShort: u.university_name, type: 'exam', typeLabel: '試験日', detail: r.exam_date });
    }
    if (r.result_date) {
      let ds = null;
      // 「2026年12月8日」形式
      const m = r.result_date.match(/(\d{4})年(\d{1,2})月(\d{1,2})/);
      if (m) ds = `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
      // 「2026-12-08」形式
      else if (/^\d{4}-\d{2}-\d{2}$/.test(r.result_date)) ds = r.result_date;
      if (ds) {
        events.push({ date: ds, uni: uniLabel, uniShort: u.university_name, type: 'result', typeLabel: '合格発表', detail: r.result_date });
      }
    }
  });

  events.sort((a, b) => a.date.localeCompare(b.date));

  if (events.length === 0) {
    body.innerHTML = `<div class="schedule-empty">表示できるスケジュールデータがありません。<br>出願開始日・試験日が登録された大学を選択してください。</div>`;
    return;
  }

  if (view === 'monthly') {
    // ── 月別リスト ──
    const byMonth = {};
    events.forEach(ev => {
      const [y, m] = ev.date.split('-');
      const key = `${y}-${m}`;
      if (!byMonth[key]) byMonth[key] = [];
      byMonth[key].push(ev);
    });

    const dotColor = { app: '#185FA5', exam: '#E24B4A', result: '#639922' };
    const typeBg   = { app: '#E6F1FB', exam: '#FCEBEB', result: '#EAF3DE' };
    const typeFg   = { app: '#185FA5', exam: '#A32D2D', result: '#3B6D11' };

    let html = '<div class="month-list">';
    Object.entries(byMonth).sort().forEach(([key, evs]) => {
      const [y, m] = key.split('-');
      html += `<div>
        <div class="month-label">${y}年${parseInt(m)}月</div>
        <div class="month-events">`;
      evs.forEach(ev => {
        html += `
          <div class="month-event">
            <div class="month-event-dot" style="background:${dotColor[ev.type]};"></div>
            <div class="month-event-uni">${ev.uni}</div>
            <span class="month-event-type ${ev.type}" style="background:${typeBg[ev.type]};color:${typeFg[ev.type]};">${ev.typeLabel}</span>
            <div class="month-event-date">${ev.detail || ev.date}</div>
          </div>`;
      });
      html += `</div></div>`;
    });
    html += '</div>';
    body.innerHTML = html;

  } else {
    // ── タイムライン ──
    // 月の範囲を決定
    const dates = events.map(e => e.date).filter(Boolean).sort();
    if (dates.length === 0) { body.innerHTML = '<div class="schedule-empty">日程データがありません</div>'; return; }

    const firstDate = new Date(dates[0]);
    const lastDate  = new Date(dates[dates.length - 1]);
    firstDate.setDate(1);
    lastDate.setMonth(lastDate.getMonth() + 1);
    lastDate.setDate(0);

    const months = [];
    let cur = new Date(firstDate);
    while (cur <= lastDate) {
      months.push({ y: cur.getFullYear(), m: cur.getMonth() + 1 });
      cur.setMonth(cur.getMonth() + 1);
    }

    const totalDays = (lastDate - firstDate) / 86400000 + 1;
    const pct = d => ((new Date(d) - firstDate) / 86400000 / totalDays * 100).toFixed(2);

    // 大学×入試ごとにグループ化
    const groups = {};
    selectedEvents.forEach(({ u, label, r }) => {
      const key = u.university_name + '（' + label + '）' + (r.round_name !== '通常募集' ? '　' + r.round_name : '');
      if (!groups[key]) groups[key] = { label: key, events: [] };
      if (r.application_start_sort) groups[key].events.push({ date: r.application_start_sort, type: 'app-start' });
      if (r.exam_date_sort) groups[key].events.push({ date: r.exam_date_sort, type: 'exam' });
      if (r.result_date) {
        let ds2 = null;
        const m2 = r.result_date.match(/(\d{4})年(\d{1,2})月(\d{1,2})/);
        if (m2) ds2 = `${m2[1]}-${m2[2].padStart(2,'0')}-${m2[3].padStart(2,'0')}`;
        else if (/^\d{4}-\d{2}-\d{2}$/.test(r.result_date)) ds2 = r.result_date;
        if (ds2) groups[key].events.push({ date: ds2, type: 'result' });
      }
      // 出願期間バー
      if (r.application_start_sort && r.exam_date_sort) {
        groups[key].appBar = { start: r.application_start_sort, end: r.application_start_sort };
      }
    });

    let html = `<div class="timeline-wrap" style="overflow-x:auto;">
      <table class="timeline-table" style="min-width:600px;">
        <thead><tr>
          <th class="uni-col" style="width:160px;">大学・入試</th>`;
    months.forEach(({y, m}) => {
      html += `<th>${y}/${m}</th>`;
    });
    html += `</tr></thead><tbody>`;

    Object.values(groups).forEach(g => {
      html += `<tr><td><div class="uni-name">${g.label}</div></td>`;
      months.forEach(({y, m}) => {
        const mStart = new Date(y, m-1, 1);
        const mEnd   = new Date(y, m, 0);
        const mStartPct = Math.max(0, (mStart - firstDate) / 86400000 / totalDays * 100);
        const mEndPct   = Math.min(100, (mEnd   - firstDate) / 86400000 / totalDays * 100);
        const mRange = mEndPct - mStartPct;

        const inMonth = g.events.filter(ev => {
          const d = new Date(ev.date);
          return d >= mStart && d <= mEnd;
        });

        html += `<td><div class="tl-cell">`;
        inMonth.forEach(ev => {
          const evPct = ((new Date(ev.date) - mStart) / (mEnd - mStart + 86400000) * 100).toFixed(1);
          const dotClass = ev.type === 'exam' ? 'exam' : ev.type === 'result' ? 'result' : 'app-start';
          html += `<div class="tl-dot ${dotClass}" style="left:${evPct}%;" title="${ev.type}"></div>`;
        });
        html += `</div></td>`;
      });
      html += `</tr>`;
    });

    html += `</tbody></table>
      <div class="tl-legend">
        <div class="tl-legend-item"><div style="width:8px;height:8px;border-radius:50%;background:#185FA5;"></div>出願開始</div>
        <div class="tl-legend-item"><div style="width:8px;height:8px;border-radius:50%;background:#E24B4A;"></div>試験日</div>
        <div class="tl-legend-item"><div style="width:8px;height:8px;border-radius:50%;background:#639922;"></div>合格発表</div>
      </div>
    </div>`;
    body.innerHTML = html;
  }
}

function downloadDbJSON() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kikoku_dig_db.json';
  a.click();
}


// ─── SORT ───
let currentSort = 'default';

function getSortDate(u, field) {
  // rounds構造に対応：kikokuかibの最初のroundから取得
  const sections = [u.kikoku, u.ib].filter(Boolean);
  for (const s of sections) {
    if (s.rounds && s.rounds.length > 0) {
      const val = s.rounds[0][field];
      if (val && !val.includes('X')) return val;
    }
  }
  // 旧スキーマ対応
  if (field === 'exam_date_sort') return u.exam_date_sort || null;
  if (field === 'application_start_sort') return u.application_start_sort || null;
  return null;
}

function sortData(data) {
  const sorted = [...data];
  if (currentSort === 'exam_date') {
    sorted.sort((a, b) => {
      const da = getSortDate(a, 'exam_date_sort');
      const db = getSortDate(b, 'exam_date_sort');
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return da.localeCompare(db);
    });
  } else if (currentSort === 'app_date') {
    sorted.sort((a, b) => {
      const da = getSortDate(a, 'application_start_sort');
      const db = getSortDate(b, 'application_start_sort');
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return da.localeCompare(db);
    });
  } else if (currentSort === 'name') {
    sorted.sort((a, b) => a.university_name.localeCompare(b.university_name, 'ja'));
  }
  return sorted;
}

// ─── YEAR BADGE（3段階） ───
// guideline_source: '募集要項' = 確定 / '選抜要項' = 暫定（選抜要項・概要ベース） / 未設定 = 確定扱い
function isProvisional(r) {
  const s = r.guideline_source;
  return !!s && s !== '募集要項';
}
function roundBadge(r) {
  if (!r.guideline_confirmed) {
    return `<span class="year-badge unconfirmed">⚠ ${r.guideline_year}年度 要更新</span>`;
  }
  if (isProvisional(r)) {
    return `<span class="year-badge provisional" title="${r.guideline_source}に基づく暫定データ。学生募集要項の公表後に再確認が必要です。">◆ ${r.guideline_year}年度 ${r.guideline_source}ベース</span>`;
  }
  return `<span class="year-badge confirmed">✓ ${r.guideline_year}年度 確認済</span>`;
}
function getYearBadge(u) {
  const sections = [u.kikoku, u.ib].filter(Boolean);
  const rounds = sections.flatMap(s => s.rounds || []);
  if (rounds.length === 0) return '';
  const years = [...new Set(rounds.map(r => r.guideline_year).filter(Boolean))];
  const yearStr = years.length > 0 ? years.join('・') + '年度' : '';
  if (rounds.some(r => !r.guideline_confirmed)) {
    return `<span class="year-badge unconfirmed">⚠ ${yearStr} 要更新</span>`;
  }
  if (rounds.some(isProvisional)) {
    return `<span class="year-badge provisional" title="選抜要項・入試概要に基づく暫定データを含みます。学生募集要項の公表後に再確認が必要です。">◆ ${yearStr} 選抜要項ベース</span>`;
  }
  return `<span class="year-badge confirmed">✓ ${yearStr} 確認済</span>`;
}
